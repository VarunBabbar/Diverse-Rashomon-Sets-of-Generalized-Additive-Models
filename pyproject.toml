[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gram"
version = "0.1.0"
description = "GRAM: GAM Rashomon Sets with Adaptive MCMC — sampling diverse generalized additive models from the Rashomon set."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Varun Babbar", email = "varundbabbar@gmail.com" }]
dependencies = [
    "numpy>=1.21",
    "pandas>=1.3",
    "scikit-learn>=1.0",
    "scipy>=1.7",
    "matplotlib>=3.4",
    "tqdm>=4.60",
    "torch==2.13.0"
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.1"]

[tool.setuptools]
# Only ``gram`` is a package; datasets/ is data, not importable code.
packages = ["gram"]
