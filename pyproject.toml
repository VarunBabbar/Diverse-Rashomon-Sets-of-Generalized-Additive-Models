[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gram"
version = "0.1.0"
description = "GRAM: GAM Rashomon Sets with Adaptive MCMC — sampling diverse generalized additive models from the Rashomon set."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Varun Babbar", email = "varundbabbar@gmail.com" }]
keywords = [
    "rashomon",
    "generalized-additive-models",
    "gam",
    "mcmc",
    "interpretability",
    "diversity",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.21",
    "pandas>=1.3",
    "scikit-learn>=1.0",
    "scipy>=1.7",
    "matplotlib>=3.4",
    "tqdm>=4.60",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.1"]

packages = ["gram"]
